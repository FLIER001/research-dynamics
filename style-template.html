<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efece6">
<title>页面标题（YYYY年MM月DD日）</title>
<style>
:root{--ink:#161616;--sub:#5c5c5c;--line:#e6e2da;--accent:#8c2b2b;--paper:#fffdf9;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:#efece6;color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
font-size:17px;line-height:1.85;}
main{max-width:720px;margin:0 auto;background:var(--paper);padding:28px 18px 44px;
box-shadow:0 0 0 1px rgba(0,0,0,.04);}
.mast{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:6px;}
h1{font-size:23px;line-height:1.4;margin:0 0 8px;font-weight:700;letter-spacing:.5px;text-align:center;}
.date{font-size:14px;color:var(--sub);text-align:center;letter-spacing:1px;}
section{margin-top:26px;}
h2{font-size:19px;line-height:1.5;font-weight:700;margin:0 0 14px;padding-left:11px;
border-left:4px solid var(--accent);}
article{margin:0 0 22px;}
h3{font-size:17px;line-height:1.65;font-weight:700;margin:0 0 8px;}
p{margin:0 0 12px;text-align:justify;text-justify:inter-ideograph;}
p.src{font-size:15px;line-height:1.7;color:var(--sub);text-align:left;background:#f7f4ee;
border-radius:6px;padding:9px 11px;margin:0 0 10px;}
p.abs{font-size:17px;}
.lab{font-weight:700;color:var(--ink);}
a{color:#0b5aa6;text-decoration:none;word-break:break-all;}
a:hover{text-decoration:underline;}
.entry-no{color:var(--accent);}
.timeline{margin-top:28px;padding:14px 16px;background:#f2f6fa;border-radius:8px;border-left:4px solid var(--accent);}
.timeline .t{font-weight:700;margin-bottom:6px;}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);text-align:center;}
@media (min-width:760px){body{font-size:17.5px;} main{padding:40px 44px 56px;border-radius:4px;margin-top:24px;}}

</style>
</head>
<body>
<main>
<header class="mast"><h1>智库与国际组织研究动态</h1><div class="date">2026年11月12日</div></header>
<section>
<h2>一、板块名称</h2>
<article>
<h3><span class="entry-no">1. </span>条目标题</h3>
<p class="src"><span class="lab">来源：</span>机构、作者、标题、日期、编号。 <a href="https://example.com" rel="noopener">https://example.com</a></p>
<p class="abs"><span class="lab">摘要：</span>摘要正文。</p>
</article>
</section>
<footer>本期共 N 条 · YYYY年MM月DD日</footer>
</main>
</body>
</html>
